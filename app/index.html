<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signal Agent — AI Operations Automation Platform</title>
    <meta name="description" content="Intelligent decision engine for operational workflow automation. Policy-based AI that knows when to act, when to ask, and when to stop." />
    
    <!-- Preconnect to speed up font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Load fonts with display=swap for instant text rendering -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    
    <!-- Critical CSS - Instant page render -->
    <style>
      /* Prevent FOUC and layout shift */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      
      html {
        background-color: #0a0a0f;
        color: #e5e7eb;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
      }
      
      body {
        margin: 0;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
      }
      
      #root {
        min-height: 100vh;
      }
      
      /* Instant loading spinner */
      .initial-loading {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 40px;
        height: 40px;
        border: 3px solid rgba(59, 130, 246, 0.2);
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      
      @keyframes spin {
        to { transform: translate(-50%, -50%) rotate(360deg); }
      }
      
      /* Skeleton loading for instant perceived speed */
      .skeleton {
        background: linear-gradient(
          90deg,
          rgba(255,255,255,0.05) 25%,
          rgba(255,255,255,0.1) 50%,
          rgba(255,255,255,0.05) 75%
        );
        background-size: 200% 100%;
        animation: shimmer 1.5s infinite;
      }
      
      @keyframes shimmer {
        to { background-position: -200% 0; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="initial-loading"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
